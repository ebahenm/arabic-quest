server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 25
      min-spare: 3

app:
  brand:
    name: Turathtona
  watch:
    required-cap-seconds: ${WATCH_REQUIRED_CAP_SECONDS:1800}
  quiz:
    retry-cooldown-seconds: ${QUIZ_RETRY_COOLDOWN_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false

spring:
  application:
    name: turathtona
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

---
# Local Development Profile (H2 In-Memory - runs out of the box)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:arabicquest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# Production Profile (PostgreSQL on Neon / Render — validated strictly at startup)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
