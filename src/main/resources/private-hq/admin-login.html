<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Turathtona (تراثُنا) | Secret HQ</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0b1f33">
    <link rel="stylesheet" href="/style.css?v=7">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            background: radial-gradient(circle at top, #045b62 0%, #0b1f33 65%);
        }
        .auth-card {
            background: rgba(16, 42, 67, 0.96);
            border: 1px solid rgba(201, 162, 77, 0.45);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.65), 0 0 24px var(--gold-glow);
            text-align: center;
        }
        .auth-logo {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #045b62 0%, #0b1f33 85%);
            border: 2px solid rgba(201, 162, 77, 0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin: 0 auto 0.75rem auto;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .domain-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-cream);
            background: rgba(201, 162, 77, 0.16);
            border: 1px solid rgba(201, 162, 77, 0.35);
            padding: 0.2rem 0.65rem;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--brand-gold);
            font-family: var(--font-ui);
            margin-bottom: 0.25rem;
        }
        .auth-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: var(--radius-sm);
            color: #111827;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.35rem;
            box-shadow: 0 4px 14px var(--gold-glow);
        }
        .auth-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }
        .auth-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img id="admin-login-emblem-img" src="/images/emblem.png" width="80" height="80" alt="Turathtona emblem">
            </div>
            <span class="domain-tag">Restricted HQ Access</span>
            <h1 class="auth-title">Admin Command Center</h1>
            <p class="auth-subtitle">Authorized administrator verification required.</p>

            <div id="error-box" class="auth-error"></div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Master Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter master username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Master Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" id="btn-submit" class="auth-btn">Authorize &amp; Enter ➔</button>
            </form>
        </div>
    </div>

    <script>
        const HQ_DASHBOARD_PATH = '{{HQ_DASHBOARD_PATH}}';

        const adminLoginEmb = document.getElementById('admin-login-emblem-img');
        if (adminLoginEmb) {
            adminLoginEmb.addEventListener('error', () => {
                adminLoginEmb.style.display = 'none';
                if (adminLoginEmb.parentElement) adminLoginEmb.parentElement.textContent = '🛡️';
            });
        }

        try {
            ['aq_auth_token', 'aq_username', 'aq_fullname', 'aq_role'].forEach(k => localStorage.removeItem(k));
        } catch (_) {}

        (async function checkExistingSession() {
            try {
                const res = await fetch('/api/auth/me', {
                    credentials: 'same-origin',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (res.ok) {
                    const me = await res.json();
                    if (me && me.role === 'ROLE_ADMIN') {
                        window.location.replace(HQ_DASHBOARD_PATH);
                    }
                }
            } catch (_) {}
        })();

        document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('btn-submit');

            errBox.style.display = 'none';
            submitBtn.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.role !== 'ROLE_ADMIN') {
                        await fetch('/api/auth/logout', {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: { 'X-Requested-With': 'XMLHttpRequest' }
                        }).catch(() => {});
                        errBox.textContent = 'Access Denied: Administrator privileges required.';
                        errBox.style.display = 'block';
                        return;
                    }
                    window.location.replace(HQ_DASHBOARD_PATH);
                } else {
                    const err = await res.json().catch(() => ({}));
                    errBox.textContent = err.error || 'Invalid credentials';
                    errBox.style.display = 'block';
                }
            } catch (_) {
                errBox.textContent = 'Connection error. Please try again.';
                errBox.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Authorize & Enter ➔';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
