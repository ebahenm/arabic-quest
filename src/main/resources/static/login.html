<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turathtona (تراثُنا) | Student Login</title>
    <link rel="stylesheet" href="/style.css?v=3">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            background: radial-gradient(circle at top, #142820, #090d16 65%);
        }
        .auth-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 24px var(--primary-glow);
            text-align: center;
        }
        .auth-logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin: 0 auto 0.75rem auto;
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .domain-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .auth-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: white;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 0.2rem;
        }
        .auth-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.35rem;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .divider-line {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 1.25rem 0;
            color: var(--text-subtle);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .divider-line::before, .divider-line::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider-line span {
            padding: 0 0.75rem;
        }
        .google-section {
            display: none;
        }
        .google-btn-wrap {
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">⚔️</div>
            <span class="domain-tag">turathtona.site</span>
            <h1 class="auth-title">تراثُنا • Student Portal</h1>
            <p class="auth-subtitle">Sign in with your assigned student account to watch episodes, pass quizzes, and earn rewards.</p>

            <div id="error-box" class="auth-error"></div>

            <form id="form-login" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username</label>
                    <input type="text" id="login-username" class="form-input" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" id="btn-login-submit" class="auth-btn">Enter Quest ➔</button>
            </form>

            <div id="google-auth-section" class="google-section">
                <div class="divider-line">
                    <span>Or continue with</span>
                </div>
                <div id="google-btn-container" class="google-btn-wrap"></div>
            </div>
        </div>
    </div>

    <script>
        // Clean up any legacy insecure localStorage tokens from older versions
        localStorage.removeItem('aq_auth_token');
        localStorage.removeItem('aq_role');
        localStorage.removeItem('aq_username');
        localStorage.removeItem('aq_fullname');

        function showError(msg) {
            const b = document.getElementById('error-box');
            b.textContent = msg;
            b.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already logged in via HttpOnly session cookie
            try {
                const meRes = await fetch('/api/auth/me', {
                    credentials: 'same-origin',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (meRes.ok) {
                    window.location.href = '/';
                    return;
                }
            } catch (_) {}

            // Load Google Client ID dynamically if configured on server
            try {
                const cfgRes = await fetch('/api/public/config', { credentials: 'same-origin' });
                if (cfgRes.ok) {
                    const cfg = await cfgRes.json();
                    if (cfg.googleSignInEnabled && cfg.googleClientId) {
                        initGoogleButton(cfg.googleClientId);
                    }
                }
            } catch (_) {}
        });

        function initGoogleButton(clientId) {
            const tryRender = (attemptsLeft) => {
                if (window.google && google.accounts && google.accounts.id) {
                    google.accounts.id.initialize({
                        client_id: clientId,
                        callback: handleGoogleCredentialResponse,
                        ux_mode: 'popup',
                        auto_select: false
                    });
                    document.getElementById('google-auth-section').style.display = 'block';
                    google.accounts.id.renderButton(
                        document.getElementById('google-btn-container'),
                        { theme: 'outline', size: 'large', width: 340, text: 'signin_with' }
                    );
                } else if (attemptsLeft > 0) {
                    setTimeout(() => tryRender(attemptsLeft - 1), 250);
                }
            };
            tryRender(20);
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            document.getElementById('error-box').style.display = 'none';
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-submit');

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const err = await res.json().catch(() => ({}));
                    showError(err.error || 'Invalid username or password');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enter Quest ➔';
            }
        }

        async function handleGoogleCredentialResponse(response) {
            document.getElementById('error-box').style.display = 'none';
            if (!response || !response.credential) {
                showError('Google authentication was cancelled.');
                return;
            }

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ credential: response.credential })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const err = await res.json().catch(() => ({}));
                    showError(err.error || 'Google sign-in failed.');
                }
            } catch (err) {
                showError('Error connecting to authentication service.');
            }
        }
    </script>
</body>
</html>
