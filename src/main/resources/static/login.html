<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turathtona (تراثُنا) | Sign In</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0b1f33">
    <link rel="stylesheet" href="/style.css?v=6">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            background: radial-gradient(circle at top, #045b62 0%, #0b1f33 62%);
        }
        .auth-card {
            background: rgba(16, 42, 67, 0.96);
            border: 1px solid rgba(201, 162, 77, 0.42);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.65), 0 0 28px rgba(201, 162, 77, 0.16);
            text-align: center;
        }
        .auth-logo {
            width: 84px;
            height: 84px;
            background: radial-gradient(circle, #045b62 0%, #0b1f33 85%);
            border: 2px solid rgba(201, 162, 77, 0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin: 0 auto 0.85rem auto;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .domain-tag {
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--brand-cream);
            background: rgba(4, 91, 98, 0.45);
            border: 1px solid rgba(201, 162, 77, 0.35);
            padding: 0.22rem 0.7rem;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-bottom: 0.45rem;
        }
        .auth-arabic-wordmark {
            font-family: var(--font-arabic-display);
            font-size: 2.35rem;
            font-weight: 700;
            color: var(--brand-gold);
            line-height: 1.15;
            margin-bottom: 0.15rem;
        }
        .auth-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--brand-cream);
            margin-bottom: 0.35rem;
        }
        .auth-subtitle {
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--brand-cream);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 0.92rem;
            background: linear-gradient(135deg, var(--brand-gold), var(--brand-amber));
            border: 1px solid rgba(245, 236, 214, 0.35);
            border-radius: var(--radius-sm);
            color: #0b1f33;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.35rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }
        .back-home-link {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-home-link:hover {
            color: var(--brand-gold);
        }
        .divider-line {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 1.25rem 0;
            color: var(--text-subtle);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .divider-line::before, .divider-line::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider-line span {
            padding: 0 0.75rem;
        }
        .google-section {
            display: none;
        }
        .google-btn-wrap {
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img id="login-emblem-img" src="/images/emblem.png" width="84" height="84" alt="Turathtona emblem">
            </div>
            <span id="login-brand-tag" class="domain-tag">Turathtona</span>
            <div class="auth-arabic-wordmark" lang="ar" dir="rtl">تراثُنا</div>
            <h1 class="auth-title">Sign in to Your Courses</h1>
            <p class="auth-subtitle">Sign in with your assigned student account to watch courses, pass quizzes, and earn rewards.</p>

            <div id="error-box" class="auth-error"></div>

            <form id="form-login" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username</label>
                    <input type="text" id="login-username" class="form-input" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" id="btn-login-submit" class="auth-btn">Sign in ➔</button>
            </form>

            <div id="google-auth-section" class="google-section">
                <div class="divider-line">
                    <span>Or continue with</span>
                </div>
                <div id="google-btn-container" class="google-btn-wrap"></div>
            </div>

            <a href="/" class="back-home-link">← Back to Turathtona</a>
        </div>
    </div>

    <script>
        // Clean up any legacy insecure localStorage tokens from older versions
        localStorage.removeItem('aq_auth_token');
        localStorage.removeItem('aq_role');
        localStorage.removeItem('aq_username');
        localStorage.removeItem('aq_fullname');

        function getPostLoginDestination() {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                return next;
            }
            return '/';
        }

        function showError(msg) {
            const b = document.getElementById('error-box');
            b.textContent = msg;
            b.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const loginEmb = document.getElementById('login-emblem-img');
            if (loginEmb) {
                loginEmb.addEventListener('error', () => {
                    loginEmb.style.display = 'none';
                    if (loginEmb.parentElement) loginEmb.parentElement.textContent = 'ت';
                });
            }

            const nextDest = getPostLoginDestination();
            if (nextDest.startsWith('/beta')) {
                const sub = document.querySelector('.auth-subtitle');
                if (sub) {
                    sub.textContent = 'Sign in with your Admin or Beta Tester account to enter the Turathtona Beta Sandbox (/beta).';
                }
            }

            // Check if already logged in via HttpOnly session cookie
            try {
                const meRes = await fetch('/api/auth/me', {
                    credentials: 'same-origin',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (meRes.ok) {
                    window.location.href = nextDest;
                    return;
                }
            } catch (_) {}

            // Load public brand config & Google Client ID dynamically
            try {
                const cfgRes = await fetch('/api/public/config', { credentials: 'same-origin' });
                if (cfgRes.ok) {
                    const cfg = await cfgRes.json();
                    if (cfg.brandNameLatin) {
                        const tagEl = document.getElementById('login-brand-tag');
                        if (tagEl) tagEl.textContent = cfg.brandNameLatin;
                    }
                    if (cfg.googleSignInEnabled && cfg.googleClientId) {
                        initGoogleButton(cfg.googleClientId);
                    }
                }
            } catch (_) {}
        });

        function initGoogleButton(clientId) {
            const tryRender = (attemptsLeft) => {
                if (window.google && google.accounts && google.accounts.id) {
                    google.accounts.id.initialize({
                        client_id: clientId,
                        callback: handleGoogleCredentialResponse,
                        ux_mode: 'popup',
                        auto_select: false
                    });
                    document.getElementById('google-auth-section').style.display = 'block';
                    google.accounts.id.renderButton(
                        document.getElementById('google-btn-container'),
                        { theme: 'outline', size: 'large', width: 340, text: 'signin_with' }
                    );
                } else if (attemptsLeft > 0) {
                    setTimeout(() => tryRender(attemptsLeft - 1), 250);
                }
            };
            tryRender(20);
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            document.getElementById('error-box').style.display = 'none';
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-submit');

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = getPostLoginDestination();
                } else {
                    const err = await res.json().catch(() => ({}));
                    showError(err.error || 'Invalid username or password');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enter Quest ➔';
            }
        }

        async function handleGoogleCredentialResponse(response) {
            document.getElementById('error-box').style.display = 'none';
            if (!response || !response.credential) {
                showError('Google authentication was cancelled.');
                return;
            }

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ credential: response.credential })
                });

                if (res.ok) {
                    window.location.href = getPostLoginDestination();
                } else {
                    const err = await res.json().catch(() => ({}));
                    showError(err.error || 'Google sign-in failed.');
                }
            } catch (err) {
                showError('Error connecting to authentication service.');
            }
        }
    </script>
</body>
</html>
