<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turathtona (تراثُنا) | Secret HQ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            background: radial-gradient(circle at top, #2b1f0e, #090d16 65%);
        }
        .auth-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 24px var(--gold-glow);
            text-align: center;
        }
        .auth-logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin: 0 auto 0.75rem auto;
            box-shadow: 0 8px 20px var(--gold-glow);
        }
        .domain-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: #fde68a;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .auth-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: white;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 0.2rem;
        }
        .auth-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: var(--radius-sm);
            color: #111827;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.35rem;
            box-shadow: 0 4px 14px var(--gold-glow);
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">🛡️</div>
            <span class="domain-tag">Secret HQ Access</span>
            <h1 class="auth-title">Admin Command Center</h1>
            <p class="auth-subtitle">Authorized administrator verification required.</p>

            <div id="error-box" class="auth-error"></div>

            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label">Master Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" value="admin" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Master Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" value="admin123" required>
                </div>

                <button type="submit" id="btn-submit" class="auth-btn">Authorize &amp; Enter ➔</button>
            </form>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('btn-submit');

            errBox.style.display = 'none';
            submitBtn.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.role !== 'ROLE_ADMIN') {
                        errBox.textContent = 'Access Denied: Administrator privileges required.';
                        errBox.style.display = 'block';
                        return;
                    }

                    localStorage.setItem('aq_auth_token', data.token);
                    localStorage.setItem('aq_username', data.username);
                    localStorage.setItem('aq_fullname', data.fullName);
                    localStorage.setItem('aq_role', data.role);

                    // Redirect to Secret Admin Dashboard
                    window.location.href = 'turath-hq';
                } else {
                    const err = await res.json().catch(() => ({}));
                    errBox.textContent = err.error || 'Invalid credentials';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Connection error. Please try again.';
                errBox.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Authorize & Enter ➔';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
