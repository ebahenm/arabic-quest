<!-- Student Change-Password page for temporary passwords and required password updates (textContent only). -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turathtona (تراثُنا) | Change Password</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/style.css?v=13">
    <link rel="stylesheet" href="/mobile.css?v=13">
    <style>
        .cp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 1rem;
            background: radial-gradient(circle at top, #045b62 0%, #0b1f33 62%);
        }
        .cp-card {
            background: rgba(16, 42, 67, 0.96);
            border: 1px solid rgba(201, 162, 77, 0.42);
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.65);
        }
        .cp-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--brand-cream);
            margin-bottom: 0.4rem;
            text-align: center;
        }
        .cp-sub {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.5;
            text-align: center;
        }
        .cp-field {
            margin-bottom: 1rem;
        }
        .cp-label {
            display: block;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }
        .cp-input-row {
            display: flex;
            gap: 0.45rem;
            align-items: center;
        }
        .cp-input {
            flex: 1;
            min-width: 0;
            padding: 0.8rem 0.95rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--brand-cream);
            font-size: 1rem;
            min-height: 44px;
        }
        .cp-toggle {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            padding: 0 0.75rem;
            min-height: 44px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .cp-btn {
            width: 100%;
            min-height: 46px;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--brand-gold), var(--brand-amber));
            border: none;
            border-radius: var(--radius-sm);
            color: #0b1f33;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .cp-msg {
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="cp-container">
        <div class="cp-card">
            <div style="text-align:center; font-family:var(--font-arabic-display); font-size:2rem; color:var(--brand-gold); margin-bottom:0.25rem;" lang="ar" dir="rtl">تراثُنا</div>
            <h1 class="cp-title">Set Your New Password</h1>
            <p class="cp-sub">You signed in with a temporary password. Please choose a new personal password (at least 8 characters) to continue to your courses.</p>
            <div id="cp-msg" class="cp-msg"></div>
            <form id="cp-form">
                <div class="cp-field">
                    <label class="cp-label" for="cp-current">Current / Temporary Password</label>
                    <div class="cp-input-row">
                        <input type="password" id="cp-current" class="cp-input" required autocomplete="current-password">
                        <button type="button" class="cp-toggle" data-target="cp-current">Show</button>
                    </div>
                </div>
                <div class="cp-field">
                    <label class="cp-label" for="cp-new">New Password (10+ characters)</label>
                    <div class="cp-input-row">
                        <input type="password" id="cp-new" class="cp-input" minlength="10" required autocomplete="new-password">
                        <button type="button" class="cp-toggle" data-target="cp-new">Show</button>
                    </div>
                </div>
                <div class="cp-field">
                    <label class="cp-label" for="cp-confirm">Confirm New Password</label>
                    <div class="cp-input-row">
                        <input type="password" id="cp-confirm" class="cp-input" minlength="10" required autocomplete="new-password">
                        <button type="button" class="cp-toggle" data-target="cp-confirm">Show</button>
                    </div>
                </div>
                <button type="submit" id="cp-submit" class="cp-btn">Save New Password &amp; Continue ➔</button>
            </form>
        </div>
    </div>
    <script>
        document.querySelectorAll('.cp-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.getAttribute('data-target'));
                if (!input) return;
                const isPw = input.type === 'password';
                input.type = isPw ? 'text' : 'password';
                btn.textContent = isPw ? 'Hide' : 'Show';
            });
        });

        function showMessage(text, isError) {
            const box = document.getElementById('cp-msg');
            box.textContent = text;
            box.style.display = 'block';
            box.style.background = isError ? 'rgba(239,68,68,0.16)' : 'rgba(16,185,129,0.16)';
            box.style.border = isError ? '1px solid rgba(239,68,68,0.4)' : '1px solid rgba(16,185,129,0.4)';
            box.style.color = isError ? '#fca5a5' : '#6ee7b7';
        }

        document.getElementById('cp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('cp-current').value;
            const newPassword = document.getElementById('cp-new').value;
            const confirmPassword = document.getElementById('cp-confirm').value;
            if (newPassword.length < 10) {
                showMessage('New password must be at least 10 characters.', true);
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('New password and confirmation do not match.', true);
                return;
            }
            const btn = document.getElementById('cp-submit');
            btn.disabled = true;
            btn.textContent = 'Updating...';
            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const body = await res.json().catch(() => ({}));
                if (res.ok) {
                    showMessage(body.message || 'Password updated! Redirecting...', false);
                    setTimeout(() => { window.location.replace('/'); }, 700);
                } else {
                    showMessage(body.error || 'Failed to update password.', true);
                }
            } catch (_) {
                showMessage('Network error while updating password.', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save New Password & Continue ➔';
            }
        });
    </script>
</body>
</html>
